<svg xmlns="http://www.w3.org/2000/svg" width="760" height="462" viewBox="0 0 760 462" role="img" aria-label="How the demo class is routed"><title>How the demo class is routed</title><rect width="760" height="462" rx="12" fill="#FAF8F3"/><g font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="32" y="44" font-size="18" fill="#1D1F1A" text-anchor="start" font-weight="600">Different needs, different help: the 120-student demo class</text><text x="32" y="68" font-size="12.5" fill="#5F625A" text-anchor="start" font-weight="400">Synthetic class (CS201, Assignment 3). Fixed rules over test results and the stored AI reading. Nothing is sent before approval.</text><text x="32" y="118" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="400">Tests show a base-case gap</text><rect x="270" y="104" width="170" height="20" rx="4" fill="#E2DFD6"/><rect x="270" y="104" width="28.3" height="20" rx="4" fill="#5B6B7F"/><text x="450" y="119" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="600">20</text><text x="484" y="119" font-size="13" fill="#5F625A" text-anchor="start" font-weight="400">→ concept practice + new check</text><text x="32" y="162" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="400">Evidence conflicts</text><rect x="270" y="148" width="170" height="20" rx="4" fill="#E2DFD6"/><rect x="270" y="148" width="12.8" height="20" rx="4" fill="#A86A12"/><text x="450" y="163" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="600">9</text><text x="484" y="163" font-size="13" fill="#5F625A" text-anchor="start" font-weight="400">→ professor reviews first</text><text x="32" y="206" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="400">Working code, reasoning flagged</text><rect x="270" y="192" width="170" height="20" rx="4" fill="#E2DFD6"/><rect x="270" y="192" width="46.8" height="20" rx="4" fill="#A86A12"/><text x="450" y="207" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="600">33</text><text x="484" y="207" font-size="13" fill="#5F625A" text-anchor="start" font-weight="400">→ explain-your-reasoning task</text><text x="32" y="250" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="400">Code didn't run</text><rect x="270" y="236" width="170" height="20" rx="4" fill="#E2DFD6"/><rect x="270" y="236" width="2.8" height="20" rx="4" fill="#5B6B7F"/><text x="450" y="251" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="600">2</text><text x="484" y="251" font-size="13" fill="#5F625A" text-anchor="start" font-weight="400">→ debugging exercise</text><text x="32" y="294" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="400">Reasoning not confirmed</text><rect x="270" y="280" width="170" height="20" rx="4" fill="#E2DFD6"/><rect x="270" y="280" width="5.7" height="20" rx="4" fill="#8A8D84"/><text x="450" y="295" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="600">4</text><text x="484" y="295" font-size="13" fill="#5F625A" text-anchor="start" font-weight="400">→ explain-your-reasoning task</text><text x="32" y="338" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="400">No submission</text><rect x="270" y="324" width="170" height="20" rx="4" fill="#E2DFD6"/><rect x="270" y="324" width="8.5" height="20" rx="4" fill="#8A8D84"/><text x="450" y="339" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="600">6</text><text x="484" y="339" font-size="13" fill="#5F625A" text-anchor="start" font-weight="400">→ professor reaches out</text><text x="32" y="382" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="400">Tests pass, reasoning reads sound</text><rect x="270" y="368" width="170" height="20" rx="4" fill="#E2DFD6"/><rect x="270" y="368" width="65.2" height="20" rx="4" fill="#2F6B4F"/><text x="450" y="383" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="600">46</text><text x="484" y="383" font-size="13" fill="#5F625A" text-anchor="start" font-weight="400">→ no extra work</text><text x="32" y="428" font-size="12" fill="#8A8D84" text-anchor="start" font-weight="400">Source: athar/interventions/planning.py on the demo database. Amber = rests partly on AI readings.</text></g></svg>