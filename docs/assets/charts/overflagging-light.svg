<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="Over-flagging on the synthetic class"><title>Over-flagging on the synthetic class</title><rect width="760" height="330" rx="12" fill="#FAF8F3"/><g font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="32" y="44" font-size="18" fill="#1D1F1A" text-anchor="start" font-weight="600">Where the AI over-flags: “recursion stops by itself”</text><text x="32" y="68" font-size="12.5" fill="#5F625A" text-anchor="start" font-weight="400">Synthetic class with planted labels. The AI catches every planted case but flags many more, so every flag waits for the professor.</text><text x="32" y="118" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="400">Planted in the synthetic class</text><rect x="300" y="104" width="160.0" height="20" rx="4" fill="#5B6B7F"/><text x="470.0" y="119" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="600">20</text><text x="32" y="162" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="400">Flagged by the AI reading</text><rect x="300" y="148" width="360.0" height="20" rx="4" fill="#A86A12"/><text x="670.0" y="163" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="600">45</text><text x="32" y="206" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="400">Flagged after the conflict check</text><rect x="300" y="192" width="328.0" height="20" rx="4" fill="#A86A12"/><text x="638.0" y="207" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="600">41</text><text x="32" y="250" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="400">…of which match a planted case</text><rect x="300" y="236" width="160.0" height="20" rx="4" fill="#2F6B4F"/><text x="470.0" y="251" font-size="14" fill="#1D1F1A" text-anchor="start" font-weight="600">20</text><text x="32" y="296" font-size="12" fill="#8A8D84" text-anchor="start" font-weight="400">Source: athar.cli eval on the demo database. The conflict check was added after the frozen sets were run.</text></g></svg>